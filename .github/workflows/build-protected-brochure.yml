name: Build protected advisory brochure

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'brochure/profile.html'
      - 'assets/profile.webp'
      - '.github/workflows/build-protected-brochure.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system fonts and rendering libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-noto-extra libcairo2 libpango-1.0-0 libpangoft2-1.0-0 libgdk-pixbuf-2.0-0 shared-mime-info

      - name: Install Python packages
        run: python -m pip install --upgrade weasyprint pymupdf 'qrcode[pil]'

      - name: Generate QR codes, previews, flatten, preserve links and protect
        run: |
          mkdir -p build/previews downloads brochure
          python <<'PY'
          import os, secrets
          import fitz
          import qrcode
          from weasyprint import HTML

          site_url = 'https://mohamed8186.github.io/mohamed-advisory-services/'
          whatsapp_url = 'https://wa.me/966573314344'
          output = 'downloads/Mohamed-Salaheldin-Advisory-Profile-Protected.pdf'

          qrcode.make(site_url).save('brochure/website_qr.png')
          qrcode.make(whatsapp_url).save('brochure/whatsapp_qr.png')
          HTML(filename='brochure/profile.html', base_url=os.getcwd()).write_pdf('build/source.pdf')

          source = fitz.open('build/source.pdf')
          flat = fitz.open()
          matrix = fitz.Matrix(2.0, 2.0)
          for index, source_page in enumerate(source, start=1):
              pix = source_page.get_pixmap(matrix=matrix, alpha=False)
              pix.save(f'build/previews/page-{index}.png')
              page = flat.new_page(width=source_page.rect.width, height=source_page.rect.height)
              page.insert_image(source_page.rect, pixmap=pix)
              for link in source_page.get_links():
                  if link.get('uri') and link.get('from'):
                      page.insert_link({'kind': fitz.LINK_URI, 'from': link['from'], 'uri': link['uri']})

          flat.set_metadata({
              'title': 'Engineering Excellence Experts | Mohamed Salaheldin Advisory Profile',
              'author': 'Mohamed Salaheldin',
              'subject': 'Senior-led integrated multidisciplinary business and project advisory',
              'keywords': 'Engineering Excellence Experts, Tendering, Procurement, Supply Chain, Contracts, Project Recovery, Consultant Support, Advisory',
              'creator': 'Engineering Excellence Experts'
          })
          owner_password = secrets.token_hex(20)
          flat.save(
              output,
              encryption=fitz.PDF_ENCRYPT_AES_256,
              owner_pw=owner_password,
              user_pw='',
              permissions=0,
              garbage=4,
              deflate=True
          )
          flat.close()
          source.close()

          size = os.path.getsize(output)
          check = fitz.open(output)
          if check.needs_pass:
              check.authenticate('')
          assert check.page_count == 2, check.page_count
          assert size > 100000, size
          assert len(check[1].get_links()) >= 3, len(check[1].get_links())
          print(f'Protected brochure created: {size} bytes, {check.page_count} pages, {len(check[1].get_links())} active links on page 2')
          check.close()
          PY

      - name: Upload brochure QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: brochure-qa-${{ github.run_number }}
          path: |
            downloads/Mohamed-Salaheldin-Advisory-Profile-Protected.pdf
            build/source.pdf
            build/previews/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Commit the generated protected PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/Mohamed-Salaheldin-Advisory-Profile-Protected.pdf
          git commit -m 'Generate protected Engineering Excellence Experts two-page brochure PDF' || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
