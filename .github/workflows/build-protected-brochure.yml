name: Build protected advisory brochure

on:
  workflow_dispatch:
  push:
    branches:
      - asset-fix-20260817
    paths:
      - 'brochure/profile.html'
      - '.github/workflows/build-protected-brochure.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system fonts and rendering libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-noto-extra libcairo2 libpango-1.0-0 libpangoft2-1.0-0 libgdk-pixbuf-2.0-0 shared-mime-info

      - name: Install Python packages
        run: python -m pip install --upgrade weasyprint pymupdf 'qrcode[pil]'

      - name: Generate QR, previews, flatten and protect the brochure
        run: |
          mkdir -p build/previews downloads
          python <<'PY'
          import os, secrets
          import fitz
          import qrcode
          from weasyprint import HTML, CSS

          site_url = 'https://mohamed8186.github.io/mohamed-advisory-services/'
          output = 'downloads/Mohamed-Salaheldin-Advisory-Profile-Protected.pdf'

          qrcode.make(site_url).save('brochure/site-qr.png')
          with open('brochure/profile.html', 'r', encoding='utf-8') as source_file:
              html_text = source_file.read()
          html_text = html_text.replace('../assets/profile.webp', 'assets/profile.webp')
          html_text = html_text.replace('src="site-qr.png"', 'src="brochure/site-qr.png"')

          compact_last_page = r'''
          .page { break-inside: avoid; page-break-inside: avoid; }
          .page:last-child { padding: 10mm 14mm; }
          .page:last-child .page-title { margin-bottom: 3mm; padding-bottom: 2.5mm; }
          .page:last-child .page-title h2 { font-size: 21px; }
          .page:last-child .page-title .ar { font-size: 16px; }
          .page:last-child .why-grid { grid-template-columns: 1.04fr .96fr; gap: 4mm; }
          .page:last-child .why-list { gap: 2mm; }
          .page:last-child .why { padding: 3mm; min-height: 27mm; }
          .page:last-child .why b { font-size: 11.5px; margin-bottom: .8mm; }
          .page:last-child .why p { font-size: 8.2px; line-height: 1.32; margin-bottom: .8mm; }
          .page:last-child .modes { margin-top: 2.5mm; gap: 1.5mm; }
          .page:last-child .modes span { font-size: 7.5px; padding: 1.2mm 2.6mm; }
          .page:last-child .lab { padding: 4.5mm; border-radius: 4mm; }
          .page:last-child .lab .eyebrow { font-size: 8px; }
          .page:last-child .lab h2 { font-size: 17px; margin: 1.2mm 0; }
          .page:last-child .lab .ar { font-size: 11px; margin-bottom: 2mm; }
          .page:last-child .lab p { font-size: 8.3px; line-height: 1.38; margin-bottom: 1.5mm; }
          .page:last-child .flow { margin: 2.5mm 0; gap: 1.3mm; }
          .page:last-child .flow span { font-size: 7.2px; padding: 1.1mm 2.2mm; }
          .page:last-child .cta-panel { margin-top: 3mm; padding: 3mm; grid-template-columns: 1fr 22mm; gap: 2.5mm; }
          .page:last-child .cta-panel h3 { font-size: 13px; margin-bottom: .8mm; }
          .page:last-child .cta-panel p { font-size: 7.8px; line-height: 1.34; margin-bottom: .8mm; }
          .page:last-child .badge { font-size: 7.5px; padding: 1.3mm 2.8mm; }
          .page:last-child .qr { width: 21mm; height: 21mm; }
          .page:last-child .disclaimer { font-size: 6.1px; margin-top: 1.6mm; line-height: 1.28; }
          .page:last-child .footer { left: 14mm; right: 14mm; bottom: 3.5mm; font-size: 6.5px; }
          '''

          HTML(string=html_text, base_url=os.getcwd()).write_pdf(
              'build/source.pdf',
              stylesheets=[CSS(string=compact_last_page)]
          )

          source = fitz.open('build/source.pdf')
          flat = fitz.open()
          matrix = fitz.Matrix(1.55, 1.55)
          for index, source_page in enumerate(source, start=1):
              pix = source_page.get_pixmap(matrix=matrix, alpha=False)
              pix.save(f'build/previews/page-{index}.png')
              page = flat.new_page(width=source_page.rect.width, height=source_page.rect.height)
              page.insert_image(source_page.rect, pixmap=pix)

          flat.set_metadata({
              'title': 'Mohamed Salaheldin Advisory Profile',
              'author': 'Mohamed Salaheldin',
              'subject': 'Independent Business & Project Advisory Services',
              'keywords': 'Tendering, Procurement, Supply Chain, Contracts, Project Management, Advisory',
              'creator': 'Mohamed Salaheldin Advisory'
          })
          owner_password = secrets.token_hex(20)
          flat.save(
              output,
              encryption=fitz.PDF_ENCRYPT_AES_256,
              owner_pw=owner_password,
              user_pw='',
              permissions=0,
              garbage=4,
              deflate=True
          )
          flat.close()
          source.close()

          size = os.path.getsize(output)
          check = fitz.open(output)
          if check.needs_pass:
              check.authenticate('')
          assert check.page_count == 4, check.page_count
          assert size > 100000, size
          print(f'Protected brochure created: {size} bytes, {check.page_count} pages')
          check.close()
          PY

      - name: Upload brochure QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: brochure-qa-${{ github.run_number }}
          path: |
            downloads/Mohamed-Salaheldin-Advisory-Profile-Protected.pdf
            build/source.pdf
            build/previews/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Commit the generated protected PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/Mohamed-Salaheldin-Advisory-Profile-Protected.pdf
          git commit -m 'Generate protected advisory brochure PDF' || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
